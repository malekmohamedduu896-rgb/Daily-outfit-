<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WardrobeAI — Your daily outfit, composed</title>
<meta name="description" content="Add your wardrobe once. Get a fresh, well-matched outfit every morning.">
<meta name="theme-color" content="#0e0d0b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23141310'/%3E%3Cpath d='M30 70 50 28l20 42' fill='none' stroke='%23d9b27c' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{serif:['Fraunces','Georgia','serif'],sans:['Inter','system-ui','sans-serif']}}}};
try{if(JSON.parse(localStorage.getItem('wardrobeai.v1')).theme==='light')document.documentElement.classList.remove('dark')}catch(e){}
</script>
<style>
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i,0)*70ms)}
.quiet .rise{animation:none}
@media(prefers-reduced-motion:reduce){.rise{animation:none}}
</style>
</head>
<body class="min-h-screen bg-stone-50 pb-28 pt-[env(safe-area-inset-top)] font-sans text-stone-900 antialiased transition-colors duration-300 dark:bg-[#0e0d0b] dark:text-stone-100 md:pb-12">
<header class="sticky top-0 z-20 border-b border-stone-200 bg-stone-50/80 backdrop-blur-xl dark:border-stone-800 dark:bg-[#0e0d0b]/80">
  <div class="mx-auto flex max-w-5xl items-center gap-4 px-4 py-3">
    <a href="#today" class="flex items-center gap-2 font-serif text-2xl tracking-tight"><i class="h-2.5 w-2.5 rounded-full bg-amber-600 dark:bg-amber-300"></i>WardrobeAI</a>
    <nav id="nav" class="ml-4 hidden flex-1 gap-1 md:flex"></nav>
    <button id="th" data-act="theme" aria-label="Switch between dark and light mode" class="ml-auto grid h-10 w-10 place-items-center rounded-full border border-stone-300 transition active:scale-95 dark:border-stone-700"></button>
  </div>
</header>
<main id="app" class="mx-auto max-w-5xl px-4 py-8"></main>
<nav id="tabs" class="fixed inset-x-0 bottom-0 z-20 flex gap-1 border-t border-stone-200 bg-stone-50/90 px-2.5 pt-2 pb-[max(8px,env(safe-area-inset-bottom))] backdrop-blur-xl dark:border-stone-800 dark:bg-[#0e0d0b]/90 md:hidden"></nav>
<div id="toast" role="status" class="pointer-events-none fixed bottom-24 left-1/2 z-50 max-w-[calc(100%-2rem)] -translate-x-1/2 translate-y-4 rounded-full bg-stone-900 px-5 py-2.5 text-center text-[13px] text-stone-50 opacity-0 transition duration-300 dark:bg-stone-100 dark:text-stone-900 md:bottom-8"></div>

<script>
/* ---------- State ---------- */
const KEY='wardrobeai.v1';
const CATS=[['tops','Tops'],['outer','Outerwear'],['bottoms','Bottoms'],['shoes','Shoes'],['acc','Accessories']];
const CN=Object.fromEntries(CATS),NAV=[['today','Today'],['wardrobe','Wardrobe'],['saved','Saved']];
let S;try{S={items:[],plan:{},shuf:{},favs:[],theme:'dark',...JSON.parse(localStorage.getItem(KEY))}}catch(e){S={items:[],plan:{},shuf:{},favs:[],theme:'dark'}}
let filt='all',dcat='tops',tt;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dk=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const uid=()=>Math.random().toString(36).slice(2,10);
const byId=id=>S.items.find(i=>i.id===id);
const pieces=ids=>(ids||[]).map(byId).filter(Boolean);
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Storage is full — remove a few pieces or use smaller photos.')}}
function toast(m){const e=$('#toast');e.textContent=m;e.classList.remove('opacity-0','translate-y-4');clearTimeout(tt);tt=setTimeout(()=>e.classList.add('opacity-0','translate-y-4'),2800)}

/* ---------- Styles & icons ---------- */
const BTN='inline-flex items-center justify-center gap-2 rounded-full border px-5 py-3 text-sm font-medium transition active:scale-95';
const OUT='border-stone-300 hover:border-stone-500 dark:border-stone-700 dark:hover:border-stone-400';
const PRI='border-transparent bg-stone-900 text-stone-50 dark:bg-stone-100 dark:text-stone-900';
const ON='border-amber-600 text-amber-700 dark:border-amber-300 dark:text-amber-300';
const EYE='mb-2 text-[11px] uppercase tracking-[.18em] text-stone-500 dark:text-stone-400';
const H1='font-serif text-5xl font-light leading-none tracking-tight sm:text-6xl';
const ic=p=>`<svg class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const heart='<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>';
const I={shuffle:ic('<path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>'),heart:ic(heart),heartF:ic(heart).replace('fill="none"','fill="currentColor"'),x:ic('<path d="M6 6l12 12M18 6 6 18"/>'),
sun:ic('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/>'),moon:ic('<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>')};

/* ---------- Color & images ---------- */
function hsl(r,g,b){r/=255;g/=255;b/=255;const M=Math.max(r,g,b),m=Math.min(r,g,b),l=(M+m)/2,d=M-m;let h=0,s=0;if(d){s=d/(1-Math.abs(2*l-1));h=M===r?((g-b)/d)%6:M===g?(b-r)/d+2:(r-g)/d+4;h=(h*60+360)%360}return{h,s,l}}
const hx=h=>hsl(...[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)));
const neutral=c=>c.s<.2||c.l<.16||c.l>.88;
const bg=c=>`hsl(${Math.round(c.h)} ${Math.round(c.s*100)}% ${Math.round(c.l*100)}%)`;
function dominant(cv){const c=document.createElement('canvas');c.width=c.height=24;const x=c.getContext('2d');x.drawImage(cv,cv.width*.25,cv.height*.25,cv.width*.5,cv.height*.5,0,0,24,24);const d=x.getImageData(0,0,24,24).data;let r=0,g=0,b=0,n=0,R=0,G=0,B=0,N=0;for(let i=0;i<d.length;i+=4){R+=d[i];G+=d[i+1];B+=d[i+2];N++;if(d[i]>232&&d[i+1]>232&&d[i+2]>232)continue;r+=d[i];g+=d[i+1];b+=d[i+2];n++}return n>20?hsl(r/n,g/n,b/n):hsl(R/N,G/N,B/N)}
const prep=f=>new Promise((ok,no)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const k=Math.min(1,440/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(u);ok({img:cv.toDataURL('image/jpeg',.72),c:dominant(cv)})};im.onerror=()=>{URL.revokeObjectURL(u);no()};im.src=u});
async function addFiles(files,cat){let n=0;for(const f of files){if(!f.type.startsWith('image/'))continue;try{const p=await prep(f);S.items.push({id:uid(),cat,name:f.name.replace(/\.[^.]+$/,'').replace(/[-_]+/g,' ').slice(0,40)||'Untitled',img:p.img,c:p.c});n++}catch(e){}}
if(n){save();toast(`${n} piece${n>1?'s':''} added to ${CN[cat]}`)}else toast('Those files couldn’t be read as images.');render(true)}

/* ---------- Sample pieces ---------- */
const SH={tops:'M60 30 90 22Q100 36 110 22L140 30 175 70 152 92 140 80V205H60V80L48 92 25 70Z',outer:'M62 28 90 20 100 32 110 20 138 28 182 70 172 200H148L142 100V212H58V100L52 200H28L18 70Z',bottoms:'M62 24H138L146 216H108L100 90 92 216H54Z',shoes:'M24 150Q24 120 50 118L84 112Q96 138 124 140L170 146Q186 150 186 168V184H24Z',acc:'M84 20H116V220H84Z'};
const art=(cat,col)=>{const ex=cat==='outer'?'<path d="M100 32V212" stroke="#0004" stroke-width="3"/>':cat==='acc'?`<circle cx="100" cy="120" r="40" fill="${col}" stroke="#0005" stroke-width="5"/><circle cx="100" cy="120" r="28" fill="#0003"/><path d="M100 120V98M100 120 114 126" stroke="#fff9" stroke-width="3" stroke-linecap="round"/>`:cat==='shoes'?'<path d="M24 172H186" stroke="#0004" stroke-width="3"/>':'';return 'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240"><rect width="200" height="240" fill="#e8e4da"/><path d="${SH[cat]}" fill="${col}" stroke="#0003" stroke-width="2.5" stroke-linejoin="round"/>${ex}</svg>`)};
const SAMPLE=[['tops','Ivory Tee','#ece6d8'],['tops','Black Tee','#1b1b1b'],['tops','Slate Knit','#5b6c7e'],['tops','Olive Henley','#6e7248'],['outer','Camel Coat','#b98b5a'],['outer','Black Bomber','#242424'],['outer','Denim Jacket','#4b6b90'],['bottoms','Black Trousers','#1d1d20'],['bottoms','Stone Chinos','#c9bba4'],['bottoms','Indigo Denim','#2f4468'],['shoes','White Sneakers','#f0f0ec'],['shoes','Black Boots','#171717'],['shoes','Tan Loafers','#9b6c40'],['acc','Steel Watch','#b9bcc2'],['acc','Brass Watch','#b08d4a']];

/* ---------- Outfit engine ---------- */
const hash=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const mulberry=a=>()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
function pair(a,b){const na=neutral(a),nb=neutral(b);if(na&&nb)return Math.abs(a.l-b.l)>.25?1:.2;if(na||nb)return 1;let d=Math.abs(a.h-b.h);d=Math.min(d,360-d);return d<35?1.6:d>155?1.4:d>100&&d<140?.2:-1.5}
function score(ps,date){let s=0;for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++)s+=pair(ps[i].c,ps[j].c);const t=new Date(date+'T12:00:00');for(const p of ps)for(let d=1;d<=2;d++){const o=new Date(t);o.setDate(t.getDate()-d);if((S.plan[dk(o)]||[]).includes(p.id))s-=d===1?2:.8}return s}
function generate(date,n){const g=c=>S.items.filter(i=>i.cat===c),[T,O,B,F,A]=CATS.map(c=>g(c[0]));if(!T.length||!B.length||!F.length)return null;const r=mulberry(hash(date+':'+n)),pick=a=>a[Math.floor(r()*a.length)];let best=null,bs=-1e9;for(let k=0;k<70;k++){const ps=[pick(T),pick(B),pick(F)];if(O.length&&r()<.6)ps.splice(1,0,pick(O));if(A.length&&r()<.65)ps.push(pick(A));const s=score(ps,date)+r()*.9;if(s>bs){bs=s;best=ps}}return best.map(p=>p.id)}
function plan(){const d=dk(new Date());let ids=S.plan[d];if(!ids||ids.some(i=>!byId(i))){ids=generate(d,S.shuf[d]||0);if(ids){S.plan[d]=ids;save()}else delete S.plan[d]}return{d,ids}}
function regen(){const d=dk(new Date()),cur=(S.plan[d]||[]).join();let n=S.shuf[d]||0;for(let t=0;t<8;t++){const ids=generate(d,++n);if(ids&&ids.join()!==cur){S.shuf[d]=n;S.plan[d]=ids;save();return render()}}toast('That’s every strong pairing for now — add more pieces for new looks.')}
function mood(ps){const n=ps.filter(p=>!neutral(p.c));if(!n.length)return'Tonal neutrals';if(n.length===1)return'One bold note';let d=0;n.forEach(a=>n.forEach(b=>{const x=Math.abs(a.c.h-b.c.h);d=Math.max(d,Math.min(x,360-x))}));return d<45?'Analogous harmony':d>150?'Complementary contrast':'Considered color play'}

/* ---------- Views ---------- */
const chip=(l,attr,on)=>`<button ${attr} aria-pressed="${on}" class="shrink-0 rounded-full border px-3.5 py-2 text-[13px] transition ${on?'border-stone-900 bg-stone-900 text-stone-50 dark:border-stone-100 dark:bg-stone-100 dark:text-stone-900':'border-stone-300 text-stone-500 dark:border-stone-700 dark:text-stone-400'}">${l}</button>`;
const empty=(t,p,a)=>`<div class="rounded-3xl border border-dashed border-stone-300 px-5 py-14 text-center dark:border-stone-700"><h2 class="font-serif text-2xl">${t}</h2><p class="mx-auto mb-6 mt-2 max-w-sm text-stone-500 dark:text-stone-400">${p}</p><div class="flex flex-wrap justify-center gap-3">${a}</div></div>`;
const sampleBtn=`<button data-act="sample" class="${BTN} ${OUT}">Try with sample pieces</button>`;
const card=(p,i=0,del)=>`<article class="rise relative overflow-hidden rounded-3xl border border-stone-200 bg-white transition duration-300 hover:-translate-y-1 hover:shadow-xl dark:border-stone-800 dark:bg-[#171612]" style="--i:${i}"><div class="aspect-[4/5] bg-stone-100 dark:bg-stone-900"><img src="${p.img}" alt="${esc(p.name)}" loading="lazy" class="h-full w-full object-cover"></div><div class="px-3.5 pb-3.5 pt-3"><small class="block text-[10.5px] uppercase tracking-[.14em] text-stone-500 dark:text-stone-400">${CN[p.cat]}</small><b class="text-sm font-medium">${esc(p.name)}</b></div>${del?`<button data-act="del" data-id="${p.id}" aria-label="Remove ${esc(p.name)}" class="absolute right-2.5 top-2.5 grid h-8 w-8 place-items-center rounded-full bg-black/70 text-white">${I.x}</button>`:''}</article>`;

function vToday(){
const {ids}=plan(),ps=pieces(ids),head=`<p class="${EYE}">${new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</p>`;
if(!ps.length){const need=[['tops','a top'],['bottoms','bottoms'],['shoes','shoes']].filter(([c])=>!S.items.some(i=>i.cat===c)).map(x=>x[1]);
return head+`<h1 class="${H1} mb-8">Today’s look</h1>`+empty('Let’s fill your locker',S.items.length?`Almost there — add ${need.join(', ')} to unlock your daily look.`:'Add at least one top, one pair of bottoms and one pair of shoes, and WardrobeAI composes a fresh outfit every morning.',`<a href="#wardrobe" class="${BTN} ${PRI}">Add your pieces</a>${sampleBtn}`)}
const key=[...ids].sort().join(),fav=S.favs.some(f=>f.key===key);
return head+`<div class="mb-7 flex flex-wrap items-end justify-between gap-4"><h1 class="${H1}">Today’s look</h1><span class="rounded-full border border-stone-300 px-3.5 py-1.5 text-xs tracking-wide text-amber-700 dark:border-stone-700 dark:text-amber-300">${mood(ps)}</span></div>
<div class="grid grid-cols-2 gap-3 md:grid-cols-[repeat(auto-fit,minmax(150px,1fr))]">${ps.map((p,i)=>card(p,i)).join('')}</div>
<div class="mt-7 flex flex-wrap items-center justify-between gap-4"><div class="flex gap-2" aria-label="Outfit palette">${ps.map(p=>`<i class="h-4 w-4 rounded-full border border-stone-300 dark:border-stone-700" style="background:${bg(p.c)}"></i>`).join('')}</div>
<div class="flex flex-wrap gap-2.5"><button data-act="regen" class="${BTN} ${PRI}">${I.shuffle}Regenerate</button><button data-act="fav" aria-pressed="${fav}" class="${BTN} ${fav?ON:OUT}">${fav?I.heartF:I.heart}${fav?'Saved':'Save look'}</button></div></div>`}

function vWardrobe(){
const list=S.items.filter(i=>filt==='all'||i.cat===filt),cnt=c=>c==='all'?S.items.length:S.items.filter(i=>i.cat===c).length;
return `<p class="${EYE}">${S.items.length} piece${S.items.length===1?'':'s'}</p><h1 class="${H1} mb-7">The locker</h1>
<div class="mb-8 rounded-3xl border border-stone-200 bg-white p-4 dark:border-stone-800 dark:bg-[#171612]"><p class="${EYE}">Add to</p>
<div class="mb-3 flex flex-wrap gap-2">${CATS.map(([k,l])=>chip(l,`data-dcat="${k}"`,dcat===k)).join('')}</div>
<label id="drop" class="grid cursor-pointer place-items-center gap-1 rounded-2xl border-2 border-dashed border-stone-300 px-4 py-9 text-center text-stone-500 transition hover:border-amber-600 dark:border-stone-700 dark:text-stone-400 dark:hover:border-amber-300"><input id="file" type="file" accept="image/*" multiple class="hidden"><b class="font-medium text-stone-900 dark:text-stone-100">Tap to add photos</b><span class="text-sm">Select several at once — they’ll go into ${CN[dcat]}</span></label></div>`+
(S.items.length?`<div class="-mx-1 mb-4 flex gap-2 overflow-x-auto px-1 pb-2">${[['all','All'],...CATS].map(([k,l])=>chip(`${l} · ${cnt(k)}`,`data-filt="${k}"`,filt===k)).join('')}</div>`:'')+
(list.length?`<div class="grid grid-cols-2 gap-3 sm:grid-cols-3 md:grid-cols-4">${list.map((p,i)=>card(p,Math.min(i,10),true)).join('')}</div>`:empty(S.items.length?'Nothing here yet':'An empty locker','Photograph each piece on a plain background for the cleanest results. Colors are read automatically.',S.items.length?'':sampleBtn))}

function vSaved(){
const list=S.favs.map(f=>({f,ps:pieces(f.ids)})).filter(x=>x.ps.length>=3);
return `<p class="${EYE}">${list.length} saved</p><h1 class="${H1} mb-7">Favorites</h1>`+(list.length?`<div class="grid gap-4 sm:grid-cols-2 md:grid-cols-3">${list.map(({f,ps},i)=>`<article class="rise overflow-hidden rounded-3xl border border-stone-200 bg-white dark:border-stone-800 dark:bg-[#171612]" style="--i:${Math.min(i,10)}"><div class="grid aspect-square grid-cols-2 bg-stone-100 dark:bg-stone-900 [&>img:nth-child(3):last-child]:col-span-2">${ps.slice(0,4).map(p=>`<img src="${p.img}" alt="${esc(p.name)}" loading="lazy" class="h-full w-full object-cover">`).join('')}</div><div class="px-3.5 pt-3"><small class="block text-[10.5px] uppercase tracking-[.14em] text-stone-500 dark:text-stone-400">${mood(ps)}</small><b class="text-sm font-medium">${ps.map(p=>esc(p.name)).join(' · ')}</b></div><div class="flex gap-2 p-3.5"><button data-act="wearfav" data-id="${f.id}" class="${BTN} ${OUT} !px-4 !py-2 !text-[13px]">Wear today</button><button data-act="unfav" data-id="${f.id}" class="${BTN} ${OUT} !px-4 !py-2 !text-[13px]">Remove</button></div></article>`).join('')}</div>`:empty('No favorites yet','When a look feels right, tap Save look on the Today screen and it will wait for you here.',`<a href="#today" class="${BTN} ${PRI}">See today’s look</a>`))}

const V={today:vToday,wardrobe:vWardrobe,saved:vSaved};
function nav(r){const h=NAV.map(([k,l])=>`<a href="#${k}" class="flex-1 rounded-full px-4 py-2.5 text-center text-sm transition md:flex-none ${k===r?'bg-stone-200/70 text-stone-900 dark:bg-stone-800 dark:text-stone-100':'text-stone-500 dark:text-stone-400'}">${l}</a>`).join('');$('#nav').innerHTML=h;$('#tabs').innerHTML=h}
function render(q){const r=V[location.hash.slice(1)]?location.hash.slice(1):'today';document.body.classList.toggle('quiet',!!q);nav(r);$('#app').innerHTML=V[r]()}
function theme(){document.documentElement.classList.toggle('dark',S.theme==='dark');$('#th').innerHTML=S.theme==='dark'?I.sun:I.moon;$('meta[name=theme-color]').content=S.theme==='dark'?'#0e0d0b':'#f5f5f4'}

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
const t=e.target.closest('[data-act],[data-filt],[data-dcat]');if(!t)return;const D=t.dataset,a=D.act;
if(D.filt){filt=D.filt;return render(true)}
if(D.dcat){dcat=D.dcat;return render(true)}
const {d,ids}=plan();
if(a==='regen')regen();
else if(a==='fav'){const key=[...ids].sort().join(),i=S.favs.findIndex(f=>f.key===key);i<0?S.favs.unshift({id:uid(),key,ids}):S.favs.splice(i,1);save();render(true);toast(i<0?'Saved to favorites':'Removed from favorites')}
else if(a==='del'){S.items=S.items.filter(i=>i.id!==D.id);save();render(true)}
else if(a==='sample'){SAMPLE.forEach(([cat,name,col])=>S.items.push({id:uid(),cat,name,img:art(cat,col),c:hx(col)}));save();render();toast('Sample pieces added — replace them with your own anytime')}
else if(a==='wearfav'){const f=S.favs.find(f=>f.id===D.id);if(f){S.plan[d]=f.ids;save();location.hash='today';render()}}
else if(a==='unfav'){S.favs=S.favs.filter(f=>f.id!==D.id);save();render(true)}
else if(a==='theme'){S.theme=S.theme==='dark'?'light':'dark';save();theme()}
});
document.addEventListener('change',e=>{if(e.target.id==='file'){addFiles([...e.target.files],dcat);e.target.value=''}});
document.addEventListener('dragover',e=>{if(e.target.closest('#drop'))e.preventDefault()});
document.addEventListener('drop',e=>{if(e.target.closest('#drop')){e.preventDefault();addFiles([...e.dataTransfer.files],dcat)}});
addEventListener('hashchange',()=>{scrollTo(0,0);render()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render(true)});
theme();render();
</script>
</body>
</html>
